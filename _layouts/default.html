<!doctype html>
<!--
	Theme styled after al-folio (https://github.com/alshedivat/al-folio),
	reimplemented as plain HTML/CSS so the site keeps building on GitHub Pages.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{ page.title | default: site.title }}</title>
		<meta name="description" content="{{ page.description | default: site.description }}" />
		<link rel="icon" href="/favicon.ico" type="image/x-icon" />

		<!-- Fonts & icons -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
		<link rel="stylesheet" href="/assets/css/fontawesome-all.min.css" />

		<!-- Styles -->
		<link rel="stylesheet" href="/assets/css/al-folio.css" />
		<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}" />
	</head>

	<body>

		<!-- Header -->
			{% include nav.html %}

		<!-- Content -->
			<main class="container" role="main">
				<div class="post">
					<header class="post-header">
						<h1 class="post-title">{{ page.header_title | default: page.title | default: site.title }}</h1>
						{% if page.header_subtitle %}<p class="desc">{{ page.header_subtitle }}</p>{% endif %}
					</header>

					<article>
						{{ content }}
					</article>
				</div>
			</main>

		<!-- Footer -->
			{% include footer.html %}

		<!-- Back to top -->
			<a href="#" id="back-to-top" title="Back to top"><i class="fas fa-arrow-up"></i></a>

		<!-- Scripts -->
			<script src="/assets/js/al-folio.js"></script>

	</body>
</html>
