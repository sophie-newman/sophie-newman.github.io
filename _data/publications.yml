# Publications, grouped by the role I played on the paper. Within each group
# the most recent paper goes at the TOP -- add new entries there.
#
# Fields (all taken straight from the ADS BibTeX export):
#   title         paper title, plain text
#   authors       the first three authors, "Given Family", in ADS order
#                 (list every author instead if the paper has three or fewer)
#   more_authors  true if the paper has more authors than the ones listed above
#   journal       journal name as it should read in the citation
#   year          year of publication, shown in the badge (for a paper that is
#                 not published yet, the year it went on arXiv)
#   volume/pages  volume and page/article id, e.g. "545" / "staf1866"
#   doi           DOI, omit for papers that are not published yet
#   arxiv         arXiv id, e.g. "2501.03133"
#   submitted_to  journal a not-yet-published paper is submitted to; renders as
#                 "Submitted to MNRAS." Leave out and it just says "Submitted."
#
# Author rendering is handled by _includes/publication_list.html: if
# "Sophie L. Newman" is one of the listed authors the line ends "& others",
# otherwise it ends "& others including Sophie L. Newman".

