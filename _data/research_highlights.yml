- 'Quantified the dependence of nebular continuum and emission-line predictions on stellar population and photoionisation modelling assumptions, demonstrating their impact on SED-derived galaxy properties and synthetic observations from cosmological simulations (<a href="https://doi.org/10.1093/mnras/staf1866">Newman et al. 2026</a>).'
- 'Developed the first framework coupling a physically motivated, per-galaxy dust attenuation model to a large semi-analytic galaxy population, enabling realistic synthetic photometry for over 2&times;10<sup>5</sup> galaxies (Newman et al., in preparation).'
- 'Core developer of <code>Synthesizer</code>, an open-source Python framework for generating synthetic astrophysical observables from numerical simulations (<a href="https://ui.adsabs.harvard.edu/abs/2025OJAp....8E.152L/abstract">Lovell et al. 2025</a>, <a href="https://ui.adsabs.harvard.edu/abs/2026JOSS...11.9436R/abstract">Roper et al. 2026</a>).'
- 'Major contributor to <code>Synference</code>, an open-source package implementing simulation-based inference techniques for joint photometric and spectroscopic SED fitting (<a href="https://ui.adsabs.harvard.edu/abs/2026MNRAS.547ag282H/abstract">Harvey et al. 2026</a>).'
- 'Member of the <a href="https://learning-the-universe.org/"><em>Learning the Universe</em></a> collaboration, developing methods to generate synthetic observables from hydrodynamical simulations and semi-analytic models.'
- 'Publication record: two first-author papers, one additional first-author paper in preparation, and twelve co-authored publications since beginning my PhD in 2023.'
