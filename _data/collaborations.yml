- name: "Learning the Universe"
  tagline: "A Simons Collaboration developing forward models to connect galaxy formation simulations with observations"
  description_html: |
    <p>I am a member of the synthetic observations group within the <a href="https://learning-the-universe.org/">Learning the Universe</a>
    collaboration, developing methods to generate synthetic astrophysical observables from hydrodynamical simulations and
    semi-analytic models of galaxy formation.</p>
