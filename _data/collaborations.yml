- name: "Learning the Universe"
  tagline: "A Simons Collaboration that brings together scientists from cosmology, galaxy formation, statistics, and machine learning with a shared ambition: 
  to build a rigorous, end-to-end framework that uses observations of the large-scale structure of the universe to simultaneously constrain fundamental 
  cosmological parameters and the physics of galaxy formation."
  description_html: |
    <p>I am a member of the synthetic observations group within the <a href="https://learning-the-universe.org/">Learning the Universe</a>
    collaboration, developing techniques to take galaxies from hydrodynamical simulations and semi-analytic models and generate 
    spectral and photometric observables. In addition, the group works to predict secondary CMB anisotropies (kinetic and thermal SZ effects).</p>
  websites:
    - label: "Learning the Universe"
      url: "https://learning-the-universe.org/"
  papers:
    - label: "Newman et al., in preparation"
