- title: "Cloudy-Maraston"
  description_html: |
    <p>Stellar population synthesis models serve as indispensable tools for unraveling the intricate narrative of galaxy evolution, and
    allow physical parameters, such as stellar mass and stellar formation rate, to be inferred from spectrophotometric data through
    fitting. They are also key for linking physical properties in theoretical models to their forward modelled emission. The advent
    of the James Webb Space Telescope (JWST) has ushered in an era of abundant observations of young stellar populations at
    high redshift, characterized by strong emission lines, motivating us to integrate nebular emission into the M13 stellar population
    model.</p>
    <p>This motivated me to use the photoionisation code <code>Cloudy</code> to add nebular emission to new stellar population models by Maraston.
    I compared these to recent data by JWST and found that different modelling assumptions in stellar population models
    lead to very different predictions for the strength of the [O III] line which can lead to qualitative errors and highlights
    the need for careful model selection when interpreting observations.</p>
  websites:
    - label: "Find my models here"
      url: "/cloudy-maraston/"
  papers:
    - label: "Newman et al. 2026, MNRAS"
      url: "https://doi.org/10.1093/mnras/staf1866"

- title: "Simulation-Based Inference"
  description_html: |
    <p>Traditional approaches to parameter inference rely on explicit likelihood functions, which are often intractable in complex astrophysical
    models. Simulation-Based Inference (SBI) offers a powerful alternative by directly learning the mapping between simulated data and model
    parameters using machine learning. This framework allows one to extract posteriors even when the likelihood is unknown, by training neural
    networks on forward-modeled simulations.</p>
    <p>I use SBI techniques such as neural density estimation to constrain physical parameters from simulated
    galaxy spectra and photometry. By integrating simulation pipelines with inference frameworks, I can efficiently explore parameter spaces,
    quantify uncertainties, and connect theoretical models more directly to observations.</p>
  websites:
    - label: "synference"
      url: "https://synthesizer-project.github.io/synference/"
  papers:
    - label: "Harvey et al. 2026, MNRAS"
      url: "https://ui.adsabs.harvard.edu/abs/2026MNRAS.547ag282H/abstract"

- title: "Working with Simulations and Semi-Analytic Models"
  description_html: |
    <p>To interpret observed galaxy populations, I combine stellar and AGN SED models with cosmological simulations and semi-analytic models (SAMs)
    of galaxy formation. These tools bridge small-scale physical processes, such as star formation and feedback, with large-scale structure
    formation in the Universe.</p>
