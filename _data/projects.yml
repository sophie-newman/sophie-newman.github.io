- title: "Modelling Nebular Emission Lines"
  description_html: |
    <p>Stellar population synthesis models serve as indispensable tools for unraveling the intricate narrative of galaxy evolution, and
    allow physical parameters, such as stellar mass and stellar formation rate, to be inferred from spectrophotometric data through
    fitting. They are also key for linking physical properties in theoretical models to their forward modelled emission. The advent
    of the James Webb Space Telescope (JWST) has ushered in an era of abundant observations of young stellar populations at
    high redshift, characterized by strong emission lines, motivating us to integrate nebular emission into the M13 stellar population
    model.</p>
    <p>This motivated me to use the photoionisation code Cloudy to add nebular emission to new stellar population models by Maraston.
    I compared these to recent data by JWST and found that different modelling assumptions in stellar population models
    lead to very different predictions for the strength of the [O III] line which can lead to qualitative errors and highlights
    the need for careful model selection when interpreting observations.</p>
    <p>The strengths of individual nebular emission lines are frequently measured and compared against models to constrain the abundances
    of different elements in the nebular cloud and the properties of the ionising stars. JWST has revealed large numbers of very young galaxies
    in the early Universe whose observed light is dominated by the surrounding gas, making accurate modelling of it essential for interpreting
    observations, as shown in <a href="https://ui.adsabs.harvard.edu/abs/2026arXiv260727467V/abstract">Vijayan et al. (2026)</a>, to which I was a major contributor. The Maraston models I used account for stellar rotation, and I found
    that models built on different physical assumptions diverged substantially, with some single-star models predicting more high-energy line
    emission than models that include binary stars. These discrepancies show how the properties astrophysicists infer for galaxies, and the
    predictions generated from large cosmological simulations, can shift substantially depending on which stellar model is assumed, a
    source of uncertainty that had not previously been systematically quantified.</p>
  websites:
    - label: "Find my models here"
      url: "/cloudy-maraston/"
  papers:
    - label: "Newman et al. 2026, MNRAS"
      url: "https://doi.org/10.1093/mnras/staf1866"
    - label: "Vijayan et al. 2026, arXiv"
