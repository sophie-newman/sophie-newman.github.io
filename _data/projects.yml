- title: "Testing the Newest Dust Prescriptions"
  description_html: |
    <p>To interpret observed galaxy populations, I combine stellar and AGN population synthesis models with cosmological simulations and semi-analytic models (SAMs)
    of galaxy formation. These tools bridge small-scale physical processes, such as star formation and feedback, with large-scale structure
    formation in the Universe.</p>
    <p>I am preparing a publication testing whether relationships linking dust behaviour to a galaxy's physical properties, learned from the
    IllustrisTNG50 and TNG100 simulations (Sommovigo et al. 2025), can be applied to semi-analytic models (Somerville et al. 2008). SAMs simulate
    the formation and evolution of galaxies using simplified physical recipes rather than the full physics solved by a cosmological simulation,
    and are consequently far cheaper to run. The key test is whether, when combined with these models, the dust relationships produce galaxy
    population statistics that match those observed in the Universe. Our physically grounded dust relationships reproduce observed galaxy
    population statistics well, showing that fast, cheap SAMs can now generate realistic mock observations directly comparable to real survey
    data, without needing to run a full, expensive cosmological simulation each time.</p>
    <p>I started this work as a Pre-Doctoral Researcher at the Center for Computational Astrophysics (CCA) with Rachel Somerville and Laura Sommovigo,
    and will extend it to include the emission and attenuation of AGN as a member of the Learning the Universe collaboration.</p>
  papers:
    - label: "Newman et al in prep."

- title: "Applying Simulation-Based Inference to Large Simulation Suites"
  description_html: |
    <p>Traditional approaches to parameter inference rely on explicit likelihood functions, which are often intractable in complex astrophysical
    models. Simulation-Based Inference (SBI) offers a powerful alternative by directly learning the mapping between simulated data and model
    parameters using machine learning. This framework allows one to extract posteriors even when the likelihood is unknown, by training neural
    networks on forward-modeled simulations.</p>
    <p>I use SBI techniques such as neural density estimation to constrain physical parameters from simulated
    galaxy spectra, photometry, and luminosity functions. By integrating simulation pipelines with inference frameworks, I can efficiently explore parameter spaces,
    quantify uncertainties, and connect theoretical models directly to observations.</p>
    <p>I am currently applying SBI across several major cosmological simulation suites, including IllustrisTNG, SIMBA and EAGLE, to determine
    the dust prescriptions required to reproduce key observational constraints, such as the abundance of bright galaxies at different epochs in
    the Universe's history. SBI makes it possible to efficiently explore the high-dimensional parameter space of the dust models. By constraining
    the dust prescriptions for each flagship simulation, my work enables a publication in preparation by the Synthesizer team that will produce an
    unprecedented library of synthetic observations spanning a wide range of galaxy formation models. This will provide a valuable resource for
    interpreting the wealth and diversity of galaxies revealed by the latest wide-field surveys, allowing us to systematically connect observed
    galaxy populations to the underlying physics of galaxy formation and evolution.</p>
  papers:
    - label: "Harvey et al. 2026, MNRAS"
      url: "https://ui.adsabs.harvard.edu/abs/2026MNRAS.547ag282H/abstract"
